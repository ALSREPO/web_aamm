{% block title %}Registro{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-white dark:bg-slate-800 p-8 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700">
        <h2 class="text-2xl font-bold text-center mb-6 text-slate-800 dark:white">Crear nueva cuenta</h2>
        
        <form id="registroForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Nombre Completo</label>
                <input type="text" name="nombre" id="nombre" required 
                    class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" name="email" id="email" required 
                    class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-1">Contraseña</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Repetir Contraseña</label>
                <input type="password" id="password_confirm" required 
                    class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>

            <div id="errorPassword" class="hidden text-red-500 text-xs font-bold uppercase tracking-tight italic">
                ⚠️ Las contraseñas no coinciden
            </div>

            <button type="submit" 
                class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition-colors duration-200">
                Registrarse
            </button>
        </form>

        <div id="mensajeExito" class="hidden mt-6 p-4 bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 rounded-lg text-sm border border-green-200 dark:border-green-800">
            Si los datos son correctos, recibirás un correo para verificar tu cuenta.
        </div>

        <div class="mt-6 text-center text-sm">
            <p class="text-slate-500">¿Ya tienes cuenta?</p>
            <a href="/login" class="text-blue-500 hover:underline font-semibold">Inicia sesión aquí</a>
        </div>
    </div>
</div>>

<script>
document.getElementById('registroForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const nombre = document.getElementById('nombre').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('password_confirm').value;
    const errorMsg = document.getElementById('errorPassword');

    // VALIDACIÓN FRONTEND
    if (password !== passwordConfirm) {
        errorMsg.classList.remove('hidden');
        document.getElementById('password_confirm').focus();
        return; // Detenemos el envío
    } else {
        errorMsg.classList.add('hidden');
    }

    try {
        const response = await fetch('/api/autenticacion/registro', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, email, password })
        });

        const result = await response.json();

        if (response.ok) {
            document.getElementById('registroForm').classList.add('hidden');
            document.getElementById('mensajeExito').classList.remove('hidden');
        } else {
            alert("Error: " + result.detail);
        }
    } catch (error) {
        alert("Error de conexión");
    }
});
</script>
{% endblock %}
