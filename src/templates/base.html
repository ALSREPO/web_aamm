<!DOCTYPE html>
<html lang="es" class="dark"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web AAMM - {% block title %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-200 dark:bg-slate-900 text-slate-700 dark:text-slate-100 min-h-screen flex flex-col">

<nav class="bg-slate-200 dark:bg-slate-800 shadow-lg border-b-2 border-slate-300 dark:border-slate-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            
            <div class="flex items-center">
                <a href="/" class="text-xl font-bold text-slate-800 dark:text-white hover:opacity-80 transition group">
                    Web<span class="text-blue-500 group-hover:text-blue-400">AAMM</span>
                </a>
            </div>
            
            <div class="hidden md:flex items-center gap-6">
                {% if user %}
                <div class="flex flex-col items-end border-l border-slate-200 dark:border-slate-700 pl-6">
                    <a href="/perfil" class="text-sm font-bold text-slate-700 dark:text-slate-200 hover:text-blue-600 transition">
                        {{ user.nombre }}
                    </a>
                    <a href="/logout" class="text-[10px] font-black text-red-500 hover:text-red-700 uppercase tracking-widest transition">
                        Cerrar Sesión
                    </a>
                </div>
                {% endif %}      
            </div>
            
        </div>
    </div>
</nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
