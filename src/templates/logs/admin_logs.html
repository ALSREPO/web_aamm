{% extends "base.html" %}

{% block title %}Panel de Logs{% endblock %}

{% block content %}

    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- Cabecera adaptada a ambos modos -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between pb-6 border-b border-slate-200 dark:border-slate-800 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                    <span>📋</span> Auditoría de Logs del Sistema
                </h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Historial técnico anonimizado en disco y traducido en tiempo real.</p>
            </div>
            
            <!-- Selectores y botones adaptados -->
            <div class="flex items-center gap-3">
                <label for="selector-lineas" class="text-xs font-medium text-slate-500 dark:text-slate-400">Ver últimas:</label>
                <select id="selector-lineas" onchange="cargarLogs()" class="bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2 focus:outline-none">
                    <option value="50">50 líneas</option>
                    <option value="100">100 líneas</option>
                    <option value="500" selected>500 líneas</option>
                    <option value="1000">1000 líneas</option>
                    <option value="2000">2000 líneas</option>
                </select>
                <button onclick="cargarLogs()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm px-4 py-2 rounded-lg transition-colors flex items-center gap-2 cursor-pointer shadow-sm">
                    🔄 Actualizar
                </button>
            </div>
        </div>

        <!-- Buscador adaptado con soporte light/dark -->
        <div class="mt-6">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 dark:text-slate-500">🔍</span>
                <input type="text" id="buscador-logs" oninput="filtrarLogs()" placeholder="Filtrar por IP, correo, nombre, acción..." 
                       class="w-full bg-slate-100 dark:bg-slate-800/50 border border-slate-300 dark:border-slate-700 rounded-lg pl-10 pr-4 py-2.5 text-sm text-slate-800 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
        </div>

        <!-- Contenedor principal de la Consola -->
        <div class="mt-6 bg-white dark:bg-black border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden shadow-xl dark:shadow-2xl">
                
                <!-- Barra superior de la consola (Puntos LED y nombres) -->
                <div class="bg-slate-50 dark:bg-slate-900 px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex flex-wrap items-center gap-4">
                        <span class="text-xs text-slate-400 dark:text-slate-500 font-mono hidden md:inline">Filtros:</span>
                        
                        <!-- LED Error -->
                        <button onclick="alternarFiltro('error')" id="btn-f-error" class="flex items-center gap-2 text-xs font-mono text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800/60 px-2 py-1 rounded border border-slate-300 dark:border-slate-700 transition-all cursor-pointer shadow-sm dark:shadow-none">
                            <span class="w-2.5 h-2.5 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.5)] transition-all" id="led-error"></span>
                            <span>Error</span>
                        </button>

                        <!-- LED Warning -->
                        <button onclick="alternarFiltro('warning')" id="btn-f-warning" class="flex items-center gap-2 text-xs font-mono text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800/60 px-2 py-1 rounded border border-slate-300 dark:border-slate-700 transition-all cursor-pointer shadow-sm dark:shadow-none">
                            <span class="w-2.5 h-2.5 rounded-full bg-yellow-500 shadow-[0_0_8px_rgba(234,179,8,0.5)] transition-all" id="led-warning"></span>
                            <span>Warning</span>
                        </button>

                        <!-- LED Info -->
                        <button onclick="alternarFiltro('info')" id="btn-f-info" class="flex items-center gap-2 text-xs font-mono text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800/60 px-2 py-1 rounded border border-slate-300 dark:border-slate-700 transition-all cursor-pointer shadow-sm dark:shadow-none">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)] transition-all" id="led-info"></span>
                            <span>Info</span>
                        </button>

                        <!-- LED Debug -->
                        <button onclick="alternarFiltro('debug')" id="btn-f-debug" class="flex items-center gap-2 text-xs font-mono text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800/60 px-2 py-1 rounded border border-slate-300 dark:border-slate-700 transition-all cursor-pointer shadow-sm dark:shadow-none">
                            <span class="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.5)] transition-all" id="led-debug"></span>
                            <span>Debug</span>
                        </button>

                        <!-- Botón Limpiar (Simplificado y estilizado) -->
                        <button onclick="reestablecerTodo()" id="btn-f-reestablecer" class="flex items-center gap-2 text-xs font-mono text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800/60 px-2 py-1 rounded border border-slate-300 dark:border-slate-700 transition-all cursor-pointer shadow-sm dark:shadow-none hover:bg-slate-100 dark:hover:bg-slate-700">
                            <span>🧹 Limpiar filtros</span>
                        </button>
                    </div>
                    
                    <!-- Textos informativos de la derecha -->
                    <div class="flex items-center justify-between sm:justify-end gap-4">
                        <span id="nombre-fichero-log" class="text-xs text-slate-400 dark:text-slate-500 font-mono">Cargando archivo...</span>
                        <span id="contador-lineas" class="text-xs font-mono text-slate-400 dark:text-slate-500">Cargando...</span>
                    </div>
                </div>

                <!-- Cuerpo de logs donde caen los div inyectados por JS -->
                <div id="contenedor-logs" class="p-4 font-mono text-xs overflow-x-auto space-y-1.5 max-h-[65vh] overflow-y-auto scrollbar-thin">
                    <div class="text-slate-400 dark:text-slate-500 animate-pulse">Iniciando conexión segura con la API...</div>
                </div>
        </div>

    </div>

    <script>
        // Creamos variables globales en la ventana (window) para que el JS externo las lea
        window.LOG_FILE_PATH = '{{ LOG_FILE_PATH }}';
    </script>
    <script src="/static/js/logs/admin_logs.js" defer></script>
    
{% endblock %}
