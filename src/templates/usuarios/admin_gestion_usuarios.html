{% extends "base.html" %}

{% block title %}Gestión Usuarios{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white mb-8">Gestión de Usuarios</h1>

    <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-100 dark:border-slate-700 overflow-x-auto shadow-sm">
        <table class="w-full text-left border-collapse min-w-[700px]"> <thead>
                <tr class="bg-slate-50 dark:bg-slate-900/50 border-b border-slate-100 dark:border-slate-700">
                    <th onclick="ordenarUsuarios('nombre')"           class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase cursor-pointer hover:text-blue-600 transition">Usuario / Email ↑↓</th>
                    <th onclick="ordenarUsuarios('email_verificado')" class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase cursor-pointer hover:text-blue-600 transition text-center">Mail Verif. ↑↓</th>
                    <th onclick="ordenarUsuarios('activo')"           class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase cursor-pointer hover:text-blue-600 transition">Estado ↑↓</th>
                    <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase text-center">Acciones de Nivel</th>
                </tr>
            </thead>

            <tbody id="tabla-usuarios" class="divide-y divide-slate-50 dark:divide-slate-700">
                </tbody>
        </table>
    </div>
</div>

<script>
    let listaUsuariosGlobal = [];
    let ordenAscendente = true;

    async function cargarUsuarios() {
        const res = await fetch('/api/usuarios/listado-completo');
        listaUsuariosGlobal = await res.json();
        renderizarTabla(listaUsuariosGlobal);
    }

    function renderizarTabla(usuarios) {
        const tbody = document.getElementById('tabla-usuarios');
        tbody.innerHTML = usuarios.map(u => `
            <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-900/30 transition">
                <td class="px-6 py-4">
                    <div class="font-bold text-slate-700 dark:text-slate-200">${u.nombre}</div>
                    <div class="text-xs text-slate-400">${u.email}</div>
                </td>
                
                <td class="px-6 py-4 text-center">
                    ${u.email_verificado 
                        ? '<span class="text-green-500" title="Email verificado">✅</span>' 
                        : '<span class="text-red-400 text-xs" title="Pendiente de link">⏳ Pend.</span>'
                    }
                </td>

                <td class="px-6 py-4">${getBadgeEstado(u.activo)}</td>
                
                <td class="px-6 py-4 text-center">
                    <div class="flex justify-center gap-1"> <button onclick="resetPassword(${u.idusuario}, '${u.nombre}')" 
                                class="p-2 text-amber-600 hover:bg-amber-50 dark:hover:bg-amber-900/20 rounded-lg border border-amber-200 dark:border-amber-900/50" 
                                title="Resetear Contraseña">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                            </svg>
                        </button>
        
                        <button onclick="cambiarNivel(${u.idusuario}, 0)" class="px-2 py-1 text-[9px] font-bold rounded-lg border border-red-200 text-red-600 hover:bg-red-50 dark:border-red-900/50 dark:text-red-400">BLOQ.</button>
                        <button onclick="cambiarNivel(${u.idusuario}, 1)" class="px-2 py-1 text-[9px] font-bold rounded-lg border border-blue-200 text-blue-600 hover:bg-blue-50 dark:border-blue-900/50 dark:text-blue-400">OK</button>
                        <button onclick="cambiarNivel(${u.idusuario}, 2)" class="px-2 py-1 text-[9px] font-bold rounded-lg border border-purple-200 text-purple-600 hover:bg-purple-50 dark:border-purple-900/50 dark:text-purple-400">ADMIN</button>
                        
                        <button onclick="eliminarUsuario(${u.idusuario}, '${u.nombre}')" class="p-2 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg border border-red-200 dark:border-red-900/50" title="Eliminar">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

	function ordenarUsuarios(columna) {
		ordenAscendente = !ordenAscendente;
		listaUsuariosGlobal.sort((a, b) => {
			let valA = a[columna];
			let valB = b[columna];
			
			// Si es texto, pasamos a minúsculas para comparar bien
			if (typeof valA === 'string') {
				valA = valA.toLowerCase();
				valB = valB.toLowerCase();
			}

			if (valA < valB) return ordenAscendente ? -1 : 1;
			if (valA > valB) return ordenAscendente ? 1 : -1;
			return 0;
		});
		renderizarTabla(listaUsuariosGlobal);
	}

    function getBadgeEstado(nivel) {
        if (nivel === 0) return '<span class="px-2 py-1 bg-slate-100 text-slate-400 text-[10px] font-bold rounded-md">BLOQUEADO</span>';
        if (nivel === 1) return '<span class="px-2 py-1 bg-green-50 text-green-600 text-[10px] font-bold rounded-md">ACTIVO</span>';
        return '<span class="px-2 py-1 bg-purple-50 text-purple-600 text-[10px] font-bold rounded-md">ADMINISTRADOR</span>';
    }

    async function cambiarNivel(id, nivel) {
        const res = await fetch(`/api/usuarios/cambiar-estatus/${id}?nuevo_nivel=${nivel}`, { method: 'PUT' });
        if (res.ok) cargarUsuarios();
    }
	
	async function resetPassword(id, nombre) {
		const nuevaPass = prompt(`Introduce la nueva contraseña para ${nombre}:`);
		
		// Si el administrador cancela o deja vacío, no hacemos nada
		if (!nuevaPass || nuevaPass.trim() === "") return;

		if (confirm(`¿Seguro que quieres cambiar la contraseña de ${nombre}?`)) {
			const res = await fetch(`/api/usuarios/cambiar-password/${id}?nueva_pass=${encodeURIComponent(nuevaPass)}`, {
				method: 'PUT'
			});

			if (res.ok) {
				alert("✅ Contraseña actualizada correctamente");
			} else {
				alert("❌ Error al actualizar la contraseña");
			}
		}
	}

	async function eliminarUsuario(id, nombre) {
		// Doble confirmación para evitar desastres
		const confirmar = confirm(`¿Estás COMPLETAMENTE SEGURO de eliminar a ${nombre}?\nEsta acción no se puede deshacer y se borrarán todos sus datos.`);
		
		if (!confirmar) return;

		try {
			const res = await fetch(`/api/usuarios/eliminar-usuario/${id}`, {
				method: 'DELETE'
			});

			if (res.ok) {
				alert("🗑️ Usuario eliminado correctamente");
				cargarUsuarios(); // Recargamos la tabla para que desaparezca
			} else {
				const err = await res.json();
				alert("❌ Error: " + (err.detail || "No se pudo eliminar"));
			}
		} catch (error) {
			console.error(error);
			alert("❌ Error de conexión al servidor");
		}
	}
	
    document.addEventListener('DOMContentLoaded', cargarUsuarios);
</script>
{% endblock %}
