{% extends "base.html" %}

{% block title %}Perfil {{ user.nombre }} {% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-12">
    <div class="bg-white dark:bg-slate-800 rounded-3xl p-8 shadow-sm border border-slate-100 dark:border-slate-700">
        <div class="flex items-center gap-4 mb-8">
            <div class="h-16 w-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl font-bold uppercase">
                {{ user.nombre[0] }}
            </div>
            <div>
                <h1 class="text-2xl font-black text-slate-900 dark:text-white">{{ user.nombre }}</h1>
                <p class="text-slate-500 text-sm">{{ user.email }}</p>
            </div>
        </div>

        <hr class="border-slate-100 dark:border-slate-700 mb-8">

        <h2 class="text-lg font-bold text-slate-800 dark:text-white mb-4">Cambiar Contraseña</h2>


		<form id="form-password" class="space-y-4">
			<div>
				<label class="block text-xs font-black text-slate-400 uppercase mb-2">Contraseña Actual</label>
				<input type="password" id="pass_actual" required class="w-full bg-slate-50 dark:bg-slate-900 border-0 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none">
			</div>
			
			<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
				<div>
					<label class="block text-xs font-black text-slate-400 uppercase mb-2">Nueva Contraseña</label>
					<input type="password" id="pass_nueva" required class="w-full bg-slate-50 dark:bg-slate-900 border-0 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none">
				</div>
				<div>
					<label class="block text-xs font-black text-slate-400 uppercase mb-2">Repetir Nueva Contraseña</label>
					<input type="password" id="pass_repeticion" required class="w-full bg-slate-50 dark:bg-slate-900 border-0 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none">
				</div>
			</div>

			<div id="mensaje-error" class="hidden text-red-500 text-xs font-bold uppercase tracking-tight">
				Las contraseñas nuevas no coinciden
			</div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-xl transition-colors">
				Actualizar Contraseña
			</button>
		</form>


    </div>
</div>

<script src="/static/js/usuarios/perfil.js" defer></script>

{% endblock %}
