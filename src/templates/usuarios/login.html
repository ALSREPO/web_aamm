{% extends "base.html" %}

{% block title %}Inicio Sesión{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-white dark:bg-slate-800 p-8 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700">
        <h2 class="text-2xl font-bold text-center mb-6">Acceder a WebAAMM</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" name="email" id="email" required 
                    class="w-full px-4 py-2 rounded-lg border dark:border-slate-600 bg-transparent outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-1">Contraseña</label>
                <input type="password" name="password" id="password" required 
                    class="w-full px-4 py-2 rounded-lg border dark:border-slate-600 bg-transparent outline-none">
            </div>
			
			<div id="error-message" class="hidden text-red-500 text-xs bg-red-50 dark:bg-red-900/20 p-3 rounded-lg border border-red-200 dark:border-red-800">
			</div>
			
            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">
                Entrar
            </button>
        </form>
		
        <div class="mt-6 text-center text-sm">
            <p class="text-slate-500">¿No tienes cuenta?</p>
            <a href="/registro" class="text-blue-500 hover:underline font-semibold">Regístrate aquí</a>
        </div>
		
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault(); // <--- ESTO evita que la URL cambie y la página se recargue
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        const response = await fetch('/api/autenticacion/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }) // Enviamos el JSON que espera el Schema
        });

        const result = await response.json();

        if (response.ok) {
            // Si el login es exitoso, FastAPI ya nos envió la cookie.
            // Solo tenemos que movernos a la home.
            window.location.href = "/";
        } else {
            // Mostramos el error (ej: "Email o contraseña incorrectos")
			const errorDiv = document.getElementById('error-message');
			errorDiv.textContent = result.detail || "Error al iniciar sesión";
			errorDiv.classList.remove('hidden');
        }
    } catch (error) {
        console.error("Error:", error);
        alert("Error de conexión con el servidor");
    }
});
</script>
{% endblock %}
